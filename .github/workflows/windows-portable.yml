name: Windows portable

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or ref to build
        required: false
        type: string
      release_tag:
        description: Existing tag to publish
        required: false
        type: string
      publish:
        description: Publish a GitHub Release
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate release tag
        shell: pwsh
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $releaseTag = $env:REQUESTED_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($releaseTag) -and
              $env:GITHUB_REF -like 'refs/tags/*') {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            Write-Host "No release tag supplied; building an unpublished artifact."
            exit 0
          }
          $versionMatch = Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$'
          if (-not $versionMatch) {
            throw "Could not read the project version from pyproject.toml."
          }
          $expectedTag = "v$($versionMatch.Matches[0].Groups[1].Value)"
          if ($releaseTag -ne $expectedTag) {
            throw "Tag $releaseTag does not match project version $expectedTag."
          }
          git fetch origin master --tags
          $checkedOutCommit = git rev-parse HEAD
          $tagCommit = git rev-list -n 1 $releaseTag
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $checkedOutCommit) {
            throw "Tag $releaseTag must point to the checked-out commit $checkedOutCommit."
          }
          git fetch origin master --no-tags
          git merge-base --is-ancestor $checkedOutCommit origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit reachable from master."
          }
      - name: Build and smoke-test portable archive
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python python
      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: MyGitClient-windows-portable
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts -File |
            Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.zip.sha256' } |
            ForEach-Object { $_.FullName }
          if ($assets.Count -ne 2) {
            throw "Expected a portable ZIP and its SHA-256 checksum."
          }
          gh release create $env:RELEASE_TAG @assets `
            --verify-tag `
            --generate-notes `
            --title "MyGitClient $env:RELEASE_TAG"
