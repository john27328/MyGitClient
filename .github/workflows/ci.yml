name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or ref to check
        required: false
        type: string

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # macOS is temporarily excluded until the asynchronous amend UI test is stable.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ startsWith(matrix.os, 'ubuntu') && 'offscreen' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - name: Run Pyright with the active Python environment
        run: >-
          python -c "import subprocess, sys;
          raise SystemExit(subprocess.call([
          sys.executable, '-m', 'pyright', '--pythonpath', sys.executable]))"
      - run: pytest --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
